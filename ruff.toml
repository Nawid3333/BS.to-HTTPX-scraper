# Ruff configuration for BS.to HTTPX scraper
line-length = 120
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "native"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[lint.pydocstyle]
convention = "google"

# Type errors are not ruff's job and cannot be made ruff's job -- it has no
# type inference. Those are checked by pyright; see [tool.pyright] in
# pyproject.toml, and run `npx pyright` alongside `ruff check`.
