[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bs-to-scraper"
version = "2.1.0"
description = "BS.to series scraper and index manager (httpx version)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.3",
    "lxml>=5.3.0",
    "h2>=4.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
bs-to-scraper = "main:_run_cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]

# Ship the credentials template inside the wheel too, so an installed copy has
# a reference to copy from and is not just told to find a file that is not
# there. See the project-home note in config/config.py for where it should go.

# ==================== RELEASE AUTOMATION ====================
# Version is bumped automatically by python-semantic-release, driven by
# Conventional Commits (feat:/fix:/BREAKING CHANGE) on every push to
# main -- see .github/workflows/auto-release.yml. Don't bump `version`
# above by hand; the next automated run will just move it again.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

# ==================== TESTS ====================
# Run the suite with:      python -m pytest
# With coverage:           python -m pytest --cov
# Timing benchmarks:       python -m pytest --benchmark
# Re-record the baseline:  python -m pytest --benchmark -m benchmark --benchmark-update
#
# Benchmarks are excluded from a normal run by tests/conftest.py, so `pytest`
# stays fast; see tests/bench.py for how a regression is judged.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, but with the short traceback style that actually fits on a screen.
addopts = "-q --tb=short"
markers = [
    "benchmark: a timing test, skipped unless --benchmark is passed",
]

[tool.coverage.run]
source = ["main", "src", "config"]
branch = true
# Helper scripts that talk to the live site on purpose. They are tools, not
# code under test, and including them makes the coverage number meaningless.
omit = [
    "tests/*",
    "*/capture_fixtures.py",
    "*/probe_*.py",
    "*/manual_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

# ==================== TYPE CHECKING ====================
# Ruff does not cover this and cannot: it has no type inference, so a helper
# written without annotations -- one whose return type is then widened across
# a whole module -- is invisible to `ruff check`. That exact mistake put 138
# errors into src/index_manager.py in a single commit while ruff stayed green.
#
# Run it with:   npx pyright          (or: pip install pyright && pyright)
#
# The code shipped to users is held at zero errors. tests/ is deliberately
# outside `include`: the suite hands fakes and partial doubles to functions
# that declare a real client type, and annotating those would add noise
# without finding bugs.
[tool.pyright]
include = ["main.py", "src", "config"]
# Re-lists pyright's own defaults because setting this key replaces them
# rather than merging: naming only the additions below dropped **/.* and
# left the analyzer walking .git, .pytest_cache and .ruff_cache.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

# Ruff configuration for BS.to HTTPX scraper
[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "native"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

# Type errors are not ruff's job and cannot be made ruff's job -- it has no
# type inference. They are checked by pyright, configured in the
# [tool.pyright] section above; run `npx pyright` alongside `ruff check`.
